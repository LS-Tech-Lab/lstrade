name: Check Stop Noise (manual)

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Horas hacia adelante a revisar tras cada stop"
        default: "6"
      min_r:
        description: "Solo trades con r_multiple <= este valor (stops puros)"
        default: "-0.9"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Correr análisis de stops
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EXCHANGE_ID: ${{ secrets.EXCHANGE_ID || 'okx' }}
        run: |
          python check_stop_noise.py \
            --hours ${{ inputs.hours }} \
            --min-r ${{ inputs.min_r }} \
            --output resultados_stop_noise.csv

      - name: Subir resultados como artifact
        uses: actions/upload-artifact@v4
        with:
          name: check-stop-noise-${{ github.run_id }}
          path: resultados_stop_noise.csv
          retention-days: 30
