name: Trigger position management (cripto)

on:
  schedule:
    # Corre desfasado 5 min respecto al ciclo principal, para no competir
    # por el mismo trade justo cuando se acaba de abrir.
    - cron: "5-59/10 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de gestión de posiciones en Vercel
        run: |
          curl -sf -X POST "${{ secrets.VERCEL_MANAGE_POSITIONS_URL }}" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_CRON_SECRET }}" \
            -H "Content-Type: application/json" \
          || echo "La llamada falló — revisá los logs de la función en Vercel."
