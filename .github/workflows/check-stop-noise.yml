name: Check Stop Noise (manual)

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Horas hacia adelante a revisar tras cada stop"
        default: "6"
      min_r:
        description: "Solo trades con r_multiple <= este valor (stops puros)"
        default: "-0.9"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Correr análisis de stops (cripto)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EXCHANGE_ID: ${{ secrets.EXCHANGE_ID || 'okx' }}
        run: |
          python check_stop_noise.py \
            --hours ${{ inputs.hours }} \
            --min-r ${{ inputs.min_r }} \
            --output resultados_stop_noise_cripto.csv

      # NUEVO: clima y MLB no necesitan credenciales del exchange -- solo
      # pegan a la CLOB API de Polymarket (pública) y a la MLB Stats API
      # (pública), ambas sin auth. Corre igual aunque el paso de cripto
      # haya fallado (ej. exchange caído), para no perder este resultado.
      - name: Correr análisis de stops (clima + MLB)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python check_stop_noise_weather_mlb.py \
            --output resultados_stop_noise_weather_mlb.csv

      # NUEVO: Polymarket genérico, mismo criterio -- solo pega a la CLOB
      # API (pública). Corre igual aunque los pasos anteriores hayan
      # fallado.
      - name: Correr análisis de stops (Polymarket genérico)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python check_stop_noise_polymarket.py \
            --output resultados_stop_noise_polymarket.csv

      - name: Subir resultados como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-stop-noise-${{ github.run_id }}
          path: |
            resultados_stop_noise_cripto.csv
            resultados_stop_noise_weather_mlb.csv
            resultados_stop_noise_polymarket.csv
          retention-days: 30
