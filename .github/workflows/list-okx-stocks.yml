name: Listar acciones OKX (manual)

on:
  workflow_dispatch:
    inputs:
      filtro:
        description: "Opcional: texto a buscar, separado por espacios (ej: MU CRCL MSTR). Vacío = todas"
        default: ""

jobs:
  listar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ccxt

      - name: Listar pares de acciones en OKX spot
        run: python list_okx_stocks.py ${{ inputs.filtro }}
