name: Trigger Polymarket track results

on:
  # FIX (auditoría 02/09/2026): mismo motivo que trigger-manage-positions.yml
  # y trigger-polymarket-cycle.yml -- el `schedule` de GitHub Actions no es
  # confiable para intervalos cortos. El disparo real es ahora un cron
  # externo (cron-job.org) pegándole directo a /api/polymarket_track_results.
  # Este workflow queda solo para forzar una corrida manual puntual.
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de resultados de Polymarket en Vercel
        run: |
          curl -sf -X POST "${{ secrets.VERCEL_POLYMARKET_TRACK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_CRON_SECRET }}" \
            -H "Content-Type: application/json" \
          || echo "La llamada falló — revisá los logs de la función en Vercel."
