name: Trigger Weather cycle

on:
  # Mismo motivo que trigger-cycle.yml/trigger-polymarket-resolve.yml: el
  # `schedule` de GitHub Actions no es confiable para intervalos cortos. El
  # disparo real es un cron externo (cron-job.org, cada 30 min alcanza —
  # el pronóstico no cambia tan rápido como el precio) pegándole directo a
  # la URL de Vercel. Este workflow queda solo para forzar una corrida
  # manual puntual desde la pestaña Actions.
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de ciclo de clima en Vercel
        run: |
          curl -sf -X POST "${{ secrets.VERCEL_WEATHER_CYCLE_URL }}" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_CRON_SECRET }}" \
            -H "Content-Type: application/json" \
          || echo "La llamada falló — revisá los logs de la función en Vercel."
