name: Trigger position management (cripto)

on:
  # FIX (auditoría 02/09/2026): mismo motivo documentado en trigger-cycle.yml
  # y trigger-polymarket-resolve.yml -- el `schedule` de GitHub Actions no
  # garantiza horario ("puede demorarse o saltearse en períodos de carga
  # alta"), y este workflow lo seguía usando pese a que el resto del repo ya
  # había migrado por ese mismo problema. Para el cierre de posiciones eso
  # es particularmente riesgoso: un disparo salteado o atrasado deja
  # trailing stops sin actualizar y posiciones sin revisar por más tiempo
  # del esperado. El disparo real ahora es un cron externo (cron-job.org)
  # pegándole directo a /api/manage_positions, desfasado ~5 min respecto al
  # ciclo principal para no competir por el mismo trade recién abierto. Este
  # workflow queda solo para forzar una corrida manual puntual.
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de gestión de posiciones en Vercel
        run: |
          curl -sf -X POST "${{ secrets.VERCEL_MANAGE_POSITIONS_URL }}" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_CRON_SECRET }}" \
            -H "Content-Type: application/json" \
          || echo "La llamada falló — revisá los logs de la función en Vercel."
