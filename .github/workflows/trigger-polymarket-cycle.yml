name: Trigger Polymarket cycle

on:
  # FIX (auditoría 02/09/2026): mismo motivo que trigger-manage-positions.yml
  # -- el `schedule` de GitHub Actions no es confiable para intervalos
  # cortos (documentado por GitHub, y ya diagnosticado en este repo para
  # trigger-cycle.yml y trigger-polymarket-resolve.yml), pero este workflow
  # seguía en el mecanismo menos confiable. El disparo real es ahora un cron
  # externo (cron-job.org) pegándole directo a /api/polymarket_cycle. Este
  # workflow queda solo para forzar una corrida manual puntual.
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de ciclo de Polymarket en Vercel
        run: |
          curl -sf -X POST "${{ secrets.VERCEL_POLYMARKET_CYCLE_URL }}" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_CRON_SECRET }}" \
            -H "Content-Type: application/json" \
          || echo "La llamada falló — revisá los logs de la función en Vercel."
