name: Trigger MLB cycle

on:
  # Igual que trigger-weather-cycle.yml y trigger-polymarket-cycle.yml: el
  # `schedule` de GitHub Actions no es confiable para intervalos cortos.
  # El disparo real de producción es un cron externo (cron-job.org)
  # pegándole directo a /api/mlb_cycle. Este workflow queda solo para
  # forzar una corrida manual puntual desde la pestaña Actions.
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de ciclo de MLB en Vercel
        run: |
          curl -sf -X POST "${{ secrets.VERCEL_MLB_CYCLE_URL }}" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_CRON_SECRET }}" \
            -H "Content-Type: application/json" \
          || echo "La llamada falló — revisá los logs de la función en Vercel."
