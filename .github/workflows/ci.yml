name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check (todos los .py del repo, sin conectar a ningún exchange)
        # NUEVO: antes era una lista de archivos a mano, que en la práctica se
        # desactualiza — cuando se agregó Polymarket y se consolidó todo en
        # app.py, ninguno de esos archivos nuevos quedó cubierto acá (ni
        # siquiera app.py, el único que Vercel realmente despliega). Con un
        # glob sobre todo el repo (menos dashboard/, que es Next.js/JS y se
        # valida aparte con `next build`), este problema no puede repetirse:
        # cualquier .py nuevo queda cubierto automáticamente.
        run: |
          find . -name "*.py" -not -path "./dashboard/*" -not -path "./.git/*" -print0 \
            | xargs -0 python -m py_compile

      - name: Test de lógica con datos sintéticos (sin red)
        run: |
          python -c "
          import random, math
          from signal_engine import generate_signal
          from risk_manager import RiskManager
          from trade_planner import compute_plan
          from db import Database
          from config import Config

          # NUEVO: seed cambiada de 3 a 63. Con seed=3, la tendencia sintética
          # quedaba TAN limpia (RSI ~99.8) que disparaba el propio filtro de
          # sobrecompra extrema del motor (rsi > 72) — el motor funcionaba
          # bien, era el dato de prueba el que caía del lado equivocado del
          # umbral. Validado localmente: con seed=63 y este ruido, la señal
          # sale de forma 100% determinística (mismo score en 3 corridas).
          random.seed(63)
          def gauss(mu=0, sigma=1):
              u1, u2 = random.random(), random.random()
              return mu + sigma*math.sqrt(-2*math.log(u1))*math.cos(2*math.pi*u2)

          n=60; price=30000.0; candles=[]
          for i in range(n):
              o=price
              drift = 0.002 if i>20 else 0.0005
              sigma = 0.005 if i>20 else 0.003
              c=price*(1+gauss(drift,sigma))
              h=max(o,c)*(1+abs(gauss(0,0.0008)))
              l=min(o,c)*(1-abs(gauss(0,0.0008)))
              candles.append({'ts':i,'o':o,'h':h,'l':l,'c':c,'v':100}); price=c

          sig = generate_signal(candles)
          assert sig is not None, 'el motor de señales no detectó nada con una tendencia sintética clara'
          db = Database(':memory:')
          rm = RiskManager(Config, db)
          risk = rm.check('BTC/USDT', sig, equity=10000)
          plan = compute_plan(sig, risk, Config) if risk['pass'] else None
          print('Señal:', sig['type'], '| Riesgo OK:', risk['pass'], '| Plan generado:', plan is not None)
          print('CI OK')
          "

      - name: Verificar que app.py importa y expone todas las rutas esperadas
        # NUEVO: reemplaza al viejo "compile check de las funciones serverless
        # (api/)", que compilaba api/cycle.py y api/telegram_webhook.py —
        # archivos que YA NO SE DESPLIEGAN (ver el aviso en esos archivos).
        # Esto verifica lo que de verdad importa: que app.py (el único
        # entrypoint real de Vercel) importa sin errores y que las rutas
        # siguen registradas — así, si alguien agrega un endpoint nuevo y se
        # olvida de registrarlo en app.py (el error exacto que pasó en esta
        # misma sesión), el CI lo detecta en vez de descubrirse con un 404 en
        # producción.
        run: |
          python -c "
          import app
          expected = {
              '/api/cycle', '/api/polymarket_cycle', '/api/polymarket_resolve',
              '/api/reset_halt', '/api/telegram_webhook',
          }
          registered = {r.path for r in app.app.routes if hasattr(r, 'path')}
          missing = expected - registered
          assert not missing, f'Rutas esperadas que no están registradas en app.py: {missing}'
          print('Rutas registradas en app.py:', sorted(registered & expected))
          print('CI OK')
          "
