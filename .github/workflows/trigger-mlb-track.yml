name: Trigger MLB track results

on:
  # Mismo motivo que los demás triggers: el disparo real de producción es
  # un cron externo (cron-job.org) pegándole directo a /api/mlb_track_results.
  # Este workflow queda solo para forzar una corrida manual puntual desde
  # la pestaña Actions. Correr cada 15-30 min mientras hay partidos en
  # curso alcanza de sobra; MLB no resuelve más rápido que eso.
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de resolución de MLB en Vercel
        run: |
          curl -sf -X POST "${{ secrets.VERCEL_MLB_TRACK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_CRON_SECRET }}" \
            -H "Content-Type: application/json" \
          || echo "La llamada falló — revisá los logs de la función en Vercel."
