name: Trigger Weather cycle

on:
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de ciclo de clima en Vercel
        run: |
          curl -sf -X POST "${{ secrets.VERCEL_WEATHER_CYCLE_URL }}" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_CRON_SECRET }}" \
            -H "Content-Type: application/json" \
          || echo "La llamada falló — revisá los logs de la función en Vercel."
