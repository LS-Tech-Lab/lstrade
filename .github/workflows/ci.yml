name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check (sin conectar a ningún exchange)
        run: python -m py_compile config.py db.py exchange_client.py indicators.py signal_engine.py risk_manager.py trade_planner.py executor.py telegram_notifier.py main.py

      - name: Test de lógica con datos sintéticos (sin red)
        run: |
          python -c "
          import random, math
          from signal_engine import generate_signal
          from risk_manager import RiskManager
          from trade_planner import compute_plan
          from db import Database
          from config import Config

          random.seed(3)
          def gauss(mu=0, sigma=1):
              u1, u2 = random.random(), random.random()
              return mu + sigma*math.sqrt(-2*math.log(u1))*math.cos(2*math.pi*u2)

          n=60; price=30000.0; candles=[]
          for i in range(n):
              o=price
              # Tendencia alcista con pullbacks periódicos (cada 4 velas) en vez
              # de un drift monótono: una subida sin ningún retroceso es
              # irreal y antes empujaba el RSI a ~99, chocando con el filtro
              # de sobrecompra de generate_signal() aunque la tendencia fuera
              # sana. Con pullbacks el RSI queda ~75, más representativo de
              # un mercado real en tendencia fuerte.
              if i>20:
                  drift = -0.006 if i % 4 == 0 else 0.006
              else:
                  drift = 0.0005
              c=price*(1+gauss(drift,0.004))
              h=max(o,c)*(1+abs(gauss(0,0.0008)))
              l=min(o,c)*(1-abs(gauss(0,0.0008)))
              candles.append({'ts':i,'o':o,'h':h,'l':l,'c':c,'v':100}); price=c

          sig = generate_signal(candles)
          assert sig is not None, 'el motor de señales no detectó nada con una tendencia sintética clara'
          db = Database(':memory:')
          rm = RiskManager(Config, db)
          risk = rm.check('BTC/USDT', sig, equity=10000)
          plan = compute_plan(sig, risk, Config) if risk['pass'] else None
          print('Señal:', sig['type'], '| Riesgo OK:', risk['pass'], '| Plan generado:', plan is not None)
          print('CI OK')
          "

      - name: Compile check de las funciones serverless (api/)
        run: python -m py_compile api/cycle.py api/manage_positions.py api/polymarket_cycle.py api/polymarket_track_results.py api/telegram_webhook.py supabase_db.py
