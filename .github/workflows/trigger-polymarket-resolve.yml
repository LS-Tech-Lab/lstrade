name: Trigger Polymarket resolve

on:
  # NUEVO: mismo motivo que trigger-cycle.yml — el `schedule` de GitHub
  # Actions no es confiable para intervalos cortos (medido: corría cada
  # varias horas en vez de cada 30 min). El disparo real es ahora un cron
  # externo (cron-job.org). Este workflow queda solo para forzar una
  # corrida manual puntual desde la pestaña Actions.
  workflow_dispatch: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de resolución de Polymarket en Vercel
        run: |
          curl -sf -X POST "${{ secrets.VERCEL_POLYMARKET_RESOLVE_URL }}" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_CRON_SECRET }}" \
            -H "Content-Type: application/json" \
          || echo "La llamada falló — revisá los logs de la función en Vercel."
