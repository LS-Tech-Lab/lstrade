name: Backtest MLB (manual)

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Temporadas separadas por coma"
        default: "2023,2024,2025"
      sweep:
        description: "Grid search de HOME_FIELD_EDGE/PITCHER_ERA_SCALE/SEASON_FORM_WEIGHT (true/false)"
        default: "true"
      oos_frac:
        description: "Fracción final (0-1) a reportar aparte como out-of-sample, 0 = sin split"
        default: "0.3"

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # AUDITORÍA (13/09/2026, corrección tras primer run fallido -- "Key
      # Validation Error: ... cannot contain commas"): actions/cache exige
      # que la key no tenga comas, y --seasons se pasa justamente separado
      # por comas ("2023,2024,2025"). Se arma una versión saneada (comas ->
      # guiones) en una variable de entorno ANTES del paso de cache, en vez
      # de interpolar inputs.seasons directo en la key.
      - name: Armar key de caché sin comas
        run: echo "seasons_key=$(echo '${{ inputs.seasons }}' | tr ',' '-')" >> "$GITHUB_ENV"

      # A diferencia de backtest-polymarket.yml, acá SÍ conviene cachear
      # .backtest_cache/mlb entre corridas -- el schedule de una temporada
      # terminada y el gameLog de un pitcher que ya jugó no cambian, así que
      # una segunda corrida (ej. con --sweep distinto) no debería volver a
      # pegarle a la MLB Stats API por las mismas temporadas. La key incluye
      # "seasons_key" para no reusar caché de otro rango de temporadas por
      # error.
      - name: Cachear schedule/gameLogs de MLB Stats API
        uses: actions/cache@v4
        with:
          path: .backtest_cache/mlb
          key: mlb-backtest-cache-${{ env.seasons_key }}

      - name: Correr backtest histórico de MLB
        run: |
          python backtest_mlb.py \
            --seasons ${{ inputs.seasons }} \
            --oos-frac ${{ inputs.oos_frac }} \
            $([ "${{ inputs.sweep }}" = "true" ] && echo --sweep) \
            --output resultados_mlb.csv

      # AUDITORÍA (13/09/2026): corre la calibración logit-space sobre el
      # CSV recién generado en el mismo run -- así el veredicto (shift-only
      # vs. Platt vs. "no calibra mejor que el crudo") queda en el log de
      # esta misma corrida, con los datos frescos, en vez de tener que bajar
      # el CSV y correrlo aparte a mano cada vez.
      - name: Ajustar curva de calibración sobre los resultados frescos
        run: python mlb_calibration.py --input resultados_mlb.csv

      - name: Subir resultados como artifact
        uses: actions/upload-artifact@v4
        with:
          name: backtest-mlb-${{ github.run_id }}
          path: resultados_mlb.csv
          retention-days: 30
